<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaNuKa</title>
  <meta name="description" content="KaNuKa — La felicita ama il silenzio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --muted: #888;
      --border: #2a2a2a;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Matrix background */
    #matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.28;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .avatar-wrap {
      width: 120px;
      height: 120px;
      margin: 0 auto 28px;
      opacity: 0;
      transform: translateY(30px) scale(0.85);
      animation: avatarIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.15s;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      display: block;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .avatar-wrap:hover .avatar {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255,255,255,0.08);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.35s;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 36px;
      font-style: italic;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #333333 0%, #1a1a1a 30%, #222222 60%, #2c2c2c 100%);
      border: 1px solid #3f3f3f;
      border-radius: 14px;
      padding: 15px 20px;
      text-decoration: none;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.6s ease;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(0) scale(1);
      cursor: pointer;
    }

    .link:nth-child(1) { animation: linkIn 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.6s; }
    .link:nth-child(2) { animation: linkIn 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.72s; }
    .link:nth-child(3) { animation: linkIn 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.84s; }
    .link:nth-child(4) { animation: linkIn 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.96s; }
    .link:nth-child(5) { animation: linkIn 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.08s; }

    .link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 40%, rgba(255,255,255,0.05) 100%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .link:hover {
      border-color: #777;
      transform: translateY(-6px) scale(1.07);
      box-shadow: 0 18px 44px rgba(0,0,0,0.6);
    }

    .link:hover::before {
      opacity: 1;
    }

    .link:active {
      transform: translateY(-1px) scale(0.985);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: all 0.18s ease;
    }

    .link svg,
    .link img.icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link:hover svg,
    .link:hover img.icon {
      transform: scale(1.25) rotate(-8deg);
    }

    .link span {
      flex: 1;
      text-align: center;
    }

    /* Icon specific subtle idle animation */
    .link svg {
      animation: iconFloat 4.5s ease-in-out infinite;
    }
    .link:nth-child(2) svg { animation-delay: 0.4s; }
    .link:nth-child(3) svg { animation-delay: 0.8s; }
    .link:nth-child(4) img.icon { animation: iconFloat 4.5s ease-in-out infinite 1.2s; }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #666;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.2s;
    }

    footer a {
      color: #888;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #ccc;
    }

    .clover-link {
      color: #555;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .clover-link:hover {
      color: #8fbc8f;
      transform: scale(1.12);
    }

    /* Music controls */
    .music-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      border: 1px solid #3f3f3f;
      border-radius: 28px;
      padding: 8px 14px 8px 8px;
      z-index: 10;
      opacity: 0;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.4s;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .music-panel:hover {
      border-color: #555;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }

    .music-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #222;
      border: 1px solid #3f3f3f;
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .music-btn:hover {
      border-color: #666;
      color: #fff;
      transform: scale(1.06);
    }

    .music-btn.playing {
      border-color: #888;
      color: #fff;
      background: #2a2a2a;
    }

    .music-btn svg {
      width: 18px;
      height: 18px;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-wrap svg {
      width: 16px;
      height: 16px;
      color: #888;
      flex-shrink: 0;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      background: #333;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
      transition: background 0.2s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: #fff;
    }

    .volume-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
      border: none;
    }

    @keyframes linkIn {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUpOnly {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes avatarIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.85);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2.5px); }
    }

    @media (max-width: 420px) {
      .container {
        max-width: 100%;
      }
      h1 {
        font-size: 1.65rem;
      }
      .music-panel {
        bottom: 16px;
        right: 16px;
      }
    }
  </style>
</head>

  <script>
    // Matrix
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#4a4a4a';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 50);

    window.addEventListener('resize', () => {
      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
    });

    // Clean animation after it finishes so hover works
    document.querySelectorAll('.link').forEach(link => {
      link.addEventListener('animationend', () => {
        link.style.animation = 'none';
        link.style.opacity = '1';
        // important: do NOT set transform here, so CSS hover can control it
      });
    });

    // Music controls
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicBtn');
    const musicIcon = document.getElementById('musicIcon');
    const volumeSlider = document.getElementById('volumeSlider');

    let isPlaying = false;

    bgm.volume = 0.5;

    function updateIcon(playing) {
      if (playing) {
        musicBtn.classList.add('playing');
        musicIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // pause
      } else {
        musicBtn.classList.remove('playing');
        musicIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // play
      }
    }

    musicBtn.addEventListener('click', () => {
      if (isPlaying) {
        bgm.pause();
        isPlaying = false;
      } else {
        bgm.play().catch(() => {});
        isPlaying = true;
      }
      updateIcon(isPlaying);
    });

    volumeSlider.addEventListener('input', (e) => {
      bgm.volume = e.target.value;
    });

    // Try autoplay
    bgm.play().then(() => {
      isPlaying = true;
      updateIcon(true);
    }).catch(() => {
      // Autoplay blocked — user will need to click play
      isPlaying = false;
      updateIcon(false);
    });
  </script>
