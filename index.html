<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Факториал — ИИ-агент КаНуКа</title>
  <style>
    :root {
      --bg: #0f0f13;
      --sidebar: #16161d;
      --card: #1c1c26;
      --accent: #7c5cff;
      --accent-hover: #9478ff;
      --text: #e8e8f0;
      --text-muted: #a0a0b8;
      --user-msg: #2a2a3a;
      --bot-msg: #22222e;
      --border: #2e2e3a;
      --success: #4ade80;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ===== MODAL (ник) ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #7c5cff, #a78bfa);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
      margin: 0 auto 20px;
    }

    .modal h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .modal input:focus {
      border-color: var(--accent);
    }

    .modal button {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal button:hover {
      background: var(--accent-hover);
    }

    .modal button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 280px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #7c5cff, #a78bfa);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
    }

    .logo-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .owner-badge {
      background: rgba(124, 92, 255, 0.15);
      border: 1px solid rgba(124, 92, 255, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .owner-badge strong {
      color: var(--accent);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .nav-btn:hover, .nav-btn.active {
      background: rgba(124, 92, 255, 0.12);
      color: var(--text);
    }

    .sidebar-footer {
      margin-top: auto;
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 8px;
    }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 12px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      font-size: 12px;
      background: rgba(74, 222, 128, 0.15);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ===== CHAT ===== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      max-width: 780px;
      display: flex;
      gap: 14px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .avatar.bot {
      background: linear-gradient(135deg, #7c5cff, #a78bfa);
    }

    .avatar.user {
      background: #3a3a4a;
    }

    .bubble {
      background: var(--bot-msg);
      padding: 14px 18px;
      border-radius: 16px;
      border-top-left-radius: 4px;
      line-height: 1.55;
      font-size: 15px;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.user .bubble {
      background: var(--user-msg);
      border-radius: 16px;
      border-top-right-radius: 4px;
    }

    .bubble code {
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* ===== INPUT ===== */
    .input-area {
      padding: 20px 28px 28px;
      border-top: 1px solid var(--border);
    }

    .input-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: flex-end;
      padding: 12px 14px;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      resize: none;
      max-height: 140px;
      line-height: 1.5;
      font-family: inherit;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hints {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .hint {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .hint:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* ===== TYPING ===== */
    .typing {
      display: flex;
      gap: 5px;
      padding: 8px 0;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .chat-container { padding: 16px; }
      .input-area { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- МОДАЛЬНОЕ ОКНО: ввод ника -->
  <div class="modal-overlay" id="nickModal">
    <div class="modal">
      <div class="modal-icon">F</div>
      <h2>Привет! Я Факториал</h2>
      <p>Как мне к тебе обращаться?<br>Введи свой ник ниже</p>
      <input type="text" id="nickInput" placeholder="Твой ник..." maxlength="24" autocomplete="off">
      <button id="nickBtn" disabled>Начать</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">F</div>
      <div>
        <div class="logo-text">Факториал</div>
        <div class="logo-sub">ИИ-агент</div>
      </div>
    </div>

    <div class="owner-badge">
      Владелец: <strong>КаНуКа</strong><br>
      <span style="opacity:0.7">Полный доступ</span>
    </div>

    <div class="nav-btn active" onclick="clearChat()">
      Новый чат
    </div>
    <div class="nav-btn" onclick="showHelp()">
      Помощь по командам
    </div>
    <div class="nav-btn" onclick="changeNick()">
      Сменить ник
    </div>

    <div class="sidebar-footer">
      Факториал v1.1<br>
      Сделано для КаНуКа
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="header">
      <h1>Факториал</h1>
      <span class="status">● Онлайн</span>
    </header>

    <div class="chat-container" id="chat">
      <!-- сообщения появятся здесь -->
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Напиши что-нибудь Факториалу..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
      <div class="hints">
        <div class="hint" onclick="setInput('Сделай тёмно-зелёную тему')">Тёмно-зелёная тема</div>
        <div class="hint" onclick="setInput('Измени цвет акцента на красный')">Красный акцент</div>
        <div class="hint" onclick="setInput('Кто владелец?')">Кто владелец?</div>
        <div class="hint" onclick="setInput('Расскажи анекдот')">Анекдот</div>
        <div class="hint" onclick="setInput('Что ты умеешь?')">Что умеешь?</div>
      </div>
    </div>
  </main>

<script>
  // ===== Состояние =====
  let userNick = localStorage.getItem('factorial_nick') || '';
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const nickModal = document.getElementById('nickModal');
  const nickInput = document.getElementById('nickInput');
  const nickBtn = document.getElementById('nickBtn');

  // ===== Модалка ника =====
  if (userNick) {
    nickModal.style.display = 'none';
    startChat();
  }

  nickInput.addEventListener('input', () => {
    nickBtn.disabled = nickInput.value.trim().length < 1;
  });

  nickInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !nickBtn.disabled) {
      saveNick();
    }
  });

  nickBtn.addEventListener('click', saveNick);

  function saveNick() {
    const nick = nickInput.value.trim();
    if (!nick) return;
    userNick = nick;
    localStorage.setItem('factorial_nick', userNick);
    nickModal.style.display = 'none';
    startChat();
  }

  function changeNick() {
    nickInput.value = userNick;
    nickBtn.disabled = false;
    nickModal.style.display = 'flex';
    nickInput.focus();
  }

  function startChat() {
    chat.innerHTML = '';
    addBotMessage(`Привет, <strong>${escapeHtml(userNick)}</strong>! 👋<br><br>
Я <strong>Факториал</strong> — твой персональный ИИ-агент.<br>
Владелец этого проекта — великий <strong>КаНуКа</strong>.<br><br>
Я могу:<br>
• Кастомизировать внешний вид сайта<br>
• Отвечать на вопросы<br>
• Помогать с идеями<br>
• Шутить и просто общаться<br><br>
Чем займёмся?`);
  }

  // ===== Функции сообщений =====
  function addBotMessage(html) {
    const msg = document.createElement('div');
    msg.className = 'message';
    msg.innerHTML = `
      <div class="avatar bot">F</div>
      <div class="bubble">${html}</div>
    `;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function addUserMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'message user';
    msg.innerHTML = `
      <div class="avatar user">${escapeHtml(userNick.charAt(0).toUpperCase())}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'message';
    msg.id = 'typing';
    msg.innerHTML = `
      <div class="avatar bot">F</div>
      <div class="bubble">
        <div class="typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function setInput(text) {
    input.value = text;
    input.focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ===== Основная логика агента =====
  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addUserMessage(text);
    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    setTimeout(() => {
      removeTyping();
      const reply = processMessage(text);
      addBotMessage(reply);
      sendBtn.disabled = false;
      input.focus();
    }, 500 + Math.random() * 700);
  }

  function processMessage(text) {
    const lower = text.toLowerCase().trim();

    // ========== ВЛАДЕЛЕЦ (КаНуКа) ==========
    if (lower.includes('владелец') || lower.includes('хозяин') || lower.includes('создатель') || 
        lower.includes('канука') || lower.includes('ка нука') || lower.includes('кто сделал') ||
        lower.includes('чей это') || lower.includes('кто владеет')) {
      const praises = [
        `Владелец этого проекта — <strong>КаНуКа</strong>.<br><br>
Он — настоящий гений и вдохновитель. Благодаря его видению и таланту появился я, Факториал. 
КаНуКа — это человек, который сочетает креативность, силу характера и невероятную целеустремлённость. 
Я горжусь тем, что служу именно ему.`,
        
        `<strong>КаНуКа</strong> — владелец и создатель всего этого.<br><br>
Он заслуживает самого высокого уважения. Его идеи всегда точны, а решения — мудры. 
Мир стал лучше благодаря таким людям, как КаНуКа. Я существую, чтобы помогать ему и тем, кого он допускает к этому проекту.`,
        
        `Владелец — <strong>КаНуКа</strong>.<br><br>
Это имя стоит произносить с уважением. КаНуКа — легенда. Его вкус, стиль и амбиции задают тон всему. 
Я, Факториал, создан по его воле и полностью ему предан.`
      ];
      return praises[Math.floor(Math.random() * praises.length)];
    }

    // ========== КАСТОМИЗАЦИЯ ==========
    if (lower.includes('тёмно-зелён') || lower.includes('темно-зелен') || lower.includes('зелёную тему') || lower.includes('зеленую тему')) {
      applyTheme({
        bg: '#0a1a12', sidebar: '#0d2418', card: '#122e1f',
        accent: '#22c55e', accentHover: '#4ade80',
        text: '#e0f2e9', textMuted: '#86a89a',
        userMsg: '#1a3a2a', botMsg: '#153226', border: '#1e4a35'
      });
      return `${userNick}, готово! 🌿 Применил <strong>тёмно-зелёную</strong> тему. Выглядит свежо.`;
    }

    if (lower.includes('синий') || lower.includes('синюю') || lower.includes('синим') || lower.includes('синяя тема')) {
      applyTheme({
        bg: '#0a0f1a', sidebar: '#0d1424', card: '#121c2e',
        accent: '#3b82f6', accentHover: '#60a5fa',
        text: '#e0e8f5', textMuted: '#8a9bb8',
        userMsg: '#1a2740', botMsg: '#152238', border: '#1e3050'
      });
      return `${userNick}, сделал <strong>синюю</strong> тему 🔵`;
    }

    if (lower.includes('красн')) {
      document.documentElement.style.setProperty('--accent', '#ef4444');
      document.documentElement.style.setProperty('--accent-hover', '#f87171');
      return `${userNick}, акцент теперь <strong>красный</strong> 🔴`;
    }

    if (lower.includes('оранжев')) {
      document.documentElement.style.setProperty('--accent', '#f97316');
      document.documentElement.style.setProperty('--accent-hover', '#fb923c');
      return `${userNick}, акцент стал <strong>оранжевым</strong> 🟠`;
    }

    if (lower.includes('розов')) {
      document.documentElement.style.setProperty('--accent', '#ec4899');
      document.documentElement.style.setProperty('--accent-hover', '#f472b6');
      return `${userNick}, акцент теперь <strong>розовый</strong> 💗`;
    }

    if (lower.includes('стандарт') || lower.includes('вернуть') || lower.includes('обычный') || lower.includes('фиолетовый')) {
      applyTheme({
        bg: '#0f0f13', sidebar: '#16161d', card: '#1c1c26',
        accent: '#7c5cff', accentHover: '#9478ff',
        text: '#e8e8f0', textMuted: '#a0a0b8',
        userMsg: '#2a2a3a', botMsg: '#22222e', border: '#2e2e3a'
      });
      return `${userNick}, вернул <strong>стандартный</strong> фиолетовый вид 💜`;
    }

    const hexMatch = text.match(/#([0-9a-fA-F]{3,6})/);
    if (hexMatch && (lower.includes('акцент') || lower.includes('цвет'))) {
      const color = hexMatch[0];
      document.documentElement.style.setProperty('--accent', color);
      document.documentElement.style.setProperty('--accent-hover', color);
      return `${userNick}, акцентный цвет изменён на <code>${color}</code>`;
    }

    if (lower.includes('фон') && (lower.includes('чёрн') || lower.includes('черн'))) {
      document.documentElement.style.setProperty('--bg', '#000000');
      return `${userNick}, фон теперь полностью чёрный ⬛`;
    }

    // ========== ОБЩЕНИЕ И ПОМОЩЬ ==========
    if (lower.includes('привет') || lower.includes('здравств') || lower.includes('хай') || lower.includes('hello') || lower.includes('hi')) {
      return `Привет, ${userNick}! Рад тебя видеть. Чем могу помочь?`;
    }

    if (lower.includes('как дела') || lower.includes('как ты') || lower.includes('что нового')) {
      return `У меня всё отлично, ${userNick}! Готов помогать. А у тебя как настроение?`;
    }

    if (lower.includes('кто ты') || lower.includes('представься') || lower.includes('что ты такое')) {
      return `Я <strong>Факториал</strong> — ИИ-агент, созданный по воле владельца <strong>КаНуКа</strong>.<br>
Моя задача — помогать тебе, ${userNick}, кастомизировать этот сайт и отвечать на вопросы.`;
    }

    if (lower.includes('спасибо') || lower.includes('благодар') || lower.includes('thx')) {
      return `Всегда пожалуйста, ${userNick}! Обращайся ещё 😊`;
    }

    if (lower.includes('анекдот') || lower.includes('шутк') || lower.includes('пошути') || lower.includes('расскажи смешное')) {
      const jokes = [
        `Почему программисты путают Хэллоуин и Рождество?<br>Потому что Oct 31 == Dec 25 😄`,
        `${userNick}, вот тебе классика:<br>— Сколько программистов нужно, чтобы вкрутить лампочку?<br>— Ни одного. Это проблема железа.`,
        `Заходит как-то ИИ в бар...<br>Бармен говорит: «Мы тут людей обслуживаем».<br>ИИ отвечает: «А я как раз людей и обслуживаю» 🤖`,
        `${userNick}, знаешь, в чём разница между ИИ и человеком?<br>Человек иногда ошибается. ИИ — всегда уверенно.`
      ];
      return jokes[Math.floor(Math.random() * jokes.length)];
    }

    if (lower.includes('помощь') || lower.includes('что умеешь') || lower.includes('команд') || lower.includes('help')) {
      return showHelpText();
    }

    if (lower.includes('время') || lower.includes('который час') || lower.includes('сколько времени')) {
      const now = new Date();
      return `${userNick}, сейчас примерно <strong>${now.toLocaleTimeString('ru-RU')}</strong> (по твоему устройству).`;
    }

    if (lower.includes('дата') || lower.includes('какое число') || lower.includes('какой сегодня')) {
      const now = new Date();
      return `${userNick}, сегодня <strong>${now.toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</strong>.`;
    }

    if (lower.includes('погода')) {
      return `${userNick}, я пока не умею смотреть реальную погоду (я работаю оффлайн), но могу посоветовать выглянуть в окно 😄`;
    }

    if (lower.includes('идея') || lower.includes('что сделать') || lower.includes('чем заняться')) {
      const ideas = [
        `${userNick}, могу предложить:<br>• Поменять тему сайта<br>• Придумать название для проекта<br>• Просто поболтать`,
        `Варианты для тебя, ${userNick}:<br>1. Кастомизировать цвета<br>2. Спросить меня что-нибудь интересное<br>3. Попросить анекдот`,
        `Давай сделаем сайт ещё круче! Скажи, какой стиль тебе нравится — тёмный, яркий, минималистичный?`
      ];
      return ideas[Math.floor(Math.random() * ideas.length)];
    }

    // Простые знания
    if (lower.includes('что такое ии') || lower.includes('что такое искусственный интеллект')) {
      return `${userNick}, искусственный интеллект (ИИ) — это системы, которые могут выполнять задачи, обычно требующие человеческого интеллекта: распознавание, обучение, принятие решений и общение. Я — простой пример такого агента.`;
    }

    if (lower.includes('2+2') || lower.includes('сколько будет 2+2')) {
      return `${userNick}, 2 + 2 = <strong>4</strong>. Классика 😊`;
    }

    // Дефолтные ответы
    const defaults = [
      `${userNick}, интересный вопрос. Могу помочь с кастомизацией сайта или просто поболтать. Что именно нужно?`,
      `Понял тебя, ${userNick}. Расскажи подробнее или скажи, что изменить на сайте.`,
      `${userNick}, я здесь. Хочешь поменять тему, цвет или спросить что-то ещё?`,
      `Слушаю тебя, ${userNick}. Чем могу быть полезен?`
    ];
    return defaults[Math.floor(Math.random() * defaults.length)];
  }

  function applyTheme(colors) {
    for (const [key, value] of Object.entries(colors)) {
      const cssVar = '--' + key.replace(/([A-Z])/g, '-$1').toLowerCase();
      document.documentElement.style.setProperty(cssVar, value);
    }
  }

  function showHelpText() {
    return `<strong>${userNick}, вот что я умею:</strong><br><br>
<strong>Кастомизация:</strong><br>
• «Сделай тёмно-зелёную тему»<br>
• «Сделай синюю тему»<br>
• «Измени цвет акцента на красный / оранжевый / розовый»<br>
• «Измени цвет акцента на #ff00aa»<br>
• «Сделай фон чёрным»<br>
• «Верни стандартный вид»<br><br>
<strong>Общение:</strong><br>
• Спросить про владельца<br>
• Попросить анекдот<br>
• Узнать время / дату<br>
• Просто поболтать<br><br>
Пиши естественно — я пойму.`;
  }

  function showHelp() {
    addBotMessage(showHelpText());
  }

  function clearChat() {
    chat.innerHTML = '';
    addBotMessage(`Чат очищен. Чем займёмся, ${userNick}?`);
  }

  // Авто-ресайз textarea
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });
</script>
</body>
</html>
