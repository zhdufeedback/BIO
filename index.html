<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --muted: #888;
      --border: #2a2a2a;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Matrix background */
    #matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.28;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .avatar-wrap {
      width: 120px;
      height: 120px;
      margin: 0 auto 28px;
      opacity: 0;
      transform: translateY(30px) scale(0.92);
      animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.15s;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      display: block;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 36px;
      font-style: italic;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.42s;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #333333 0%, #1a1a1a 30%, #222222 60%, #2c2c2c 100%);
      border: 1px solid #3f3f3f;
      border-radius: 14px;
      padding: 15px 20px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(28px);
      cursor: pointer;
    }

    .link:nth-child(1) { animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.55s; }
    .link:nth-child(2) { animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.67s; }
    .link:nth-child(3) { animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.79s; }
    .link:nth-child(4) { animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.91s; }

    .link::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 40%, rgba(255,255,255,0.05) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .link:hover {
      border-color: #666;
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }

    .link:hover::before {
      opacity: 1;
    }

    .link:active {
      transform: translateY(-1px) scale(0.98);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: all 0.12s ease;
    }

    .link svg,
    .link img.icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .link:hover svg,
    .link:hover img.icon {
      transform: scale(1.12);
    }

    .link span {
      flex: 1;
      text-align: center;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #666;
      opacity: 0;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.1s;
    }

    footer a {
      color: #888;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #ccc;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 420px) {
      .container {
        max-width: 100%;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#4a4a4a';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 50);

    // Recalculate columns on resize
    window.addEventListener('resize', () => {
      columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
    });
  </script>
