<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Факториал — От Канука</title>
  <!-- AI без регистрации -->
  <style>
    :root {
      --bg: #0c0c10;
      --surface: #14141a;
      --surface-2: #1a1a22;
      --border: #2a2a35;
      --text: #e8e8ed;
      --text-dim: #8b8b9a;
      --accent: #6d5ce8;
      --accent-soft: rgba(109, 92, 232, 0.15);
      --success: #3ecf8e;
      --danger: #e85c5c;
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ========== LOGIN ========== */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .login-logo {
      width: 48px;
      height: 48px;
      background: var(--accent);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      margin-bottom: 24px;
    }

    .login-card h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-card .subtitle {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    .login-btn:hover { opacity: 0.9; }
    .login-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .login-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }

    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ========== APP LAYOUT ========== */
    #app {
      display: none;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 20px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .brand-text {
      font-size: 16px;
      font-weight: 600;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-dim);
    }

    .user-info {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .user-info .nick {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .user-info .role {
      color: var(--text-dim);
      font-size: 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover, .nav-item.active {
      background: var(--accent-soft);
      color: var(--text);
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 12px 8px 0;
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 12px;
    }

    .topbar h2 {
      font-size: 15px;
      font-weight: 600;
    }

    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge.admin {
      background: rgba(62, 207, 142, 0.15);
      color: var(--success);
    }

    /* Chat */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 720px;
      animation: in 0.25s ease;
    }

    @keyframes in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .msg.bot .msg-avatar {
      background: var(--accent);
    }

    .msg.user .msg-avatar {
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .msg-body {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .msg.user .msg-body {
      background: var(--surface-2);
    }

    .msg-body img {
      max-width: 220px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }

    /* Input */
    .composer {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .composer-inner:focus-within {
      border-color: var(--accent);
    }

    .composer textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14.5px;
      resize: none;
      max-height: 120px;
      line-height: 1.45;
      font-family: inherit;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .quick-btn {
      font-size: 12.5px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      cursor: pointer;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* ========== ADMIN PANEL ========== */
    .admin-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .admin-overlay.open { display: flex; }

    .admin-panel {
      width: 92%;
      max-width: 640px;
      max-height: 85vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .admin-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .admin-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      cursor: pointer;
    }

    .admin-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
    }

    .admin-section {
      margin-bottom: 28px;
    }

    .admin-section h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .account-form {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .account-form input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .account-form button {
      padding: 10px 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .account-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .account-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }

    .account-item .delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 13px;
      cursor: pointer;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .log-table th {
      text-align: left;
      color: var(--text-dim);
      font-weight: 500;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .log-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .log-table tr:last-child td {
      border-bottom: none;
    }

    .device-info {
      font-size: 12px;
      color: var(--text-dim);
      max-width: 200px;
      word-break: break-word;
    }

    /* Camera */
    #cameraModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 800;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #cameraModal video {
      max-width: 90%;
      max-height: 55vh;
      border-radius: 12px;
      background: #000;
    }

    .cam-actions {
      display: flex;
      gap: 12px;
    }

    .cam-actions button {
      padding: 11px 22px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }

    .cam-capture {
      background: var(--accent);
      color: white;
    }

    .cam-cancel {
      background: #333;
      color: white;
    }

    /* Theme presets in admin */
    .theme-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .theme-btn {
      padding: 8px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .theme-btn:hover {
      border-color: var(--accent);
    }

    @media (max-width: 720px) {
      .sidebar { display: none; }
      .chat-area { padding: 16px; }
      .composer { padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>

  <!-- ========== LOGIN ========== -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-logo">F</div>
      <h1>Факториал</h1>
      <p class="subtitle">От Канука · Бета тестирование</p>

      <div class="field">
        <label>Ник</label>
        <input type="text" id="loginNick" placeholder="Ваш ник" autocomplete="username" maxlength="24">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="loginPass" placeholder="Пароль" autocomplete="current-password">
      </div>

      <button class="login-btn" id="loginBtn" disabled>Войти</button>
      <div class="login-error" id="loginError"></div>

      <div class="login-footer">Доступ только по аккаунту</div>
    </div>
  </div>

  <!-- ========== APP ========== -->
  <div id="app">
    <div style="display:flex;height:100%;">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">F</div>
          <div>
            <div class="brand-text">Факториал</div>
            <div class="brand-sub">От Канука</div>
          </div>
        </div>

        <div class="user-info">
          <div class="nick" id="sidebarNick">—</div>
          <div class="role" id="sidebarRole">Пользователь</div>
        </div>

        <div class="nav-item active" onclick="clearChat()">Новый чат</div>
        <div class="nav-item" onclick="showHelp()">Помощь</div>
        <div class="nav-item" id="adminNav" style="display:none" onclick="openAdmin()">Админ-панель</div>
        <div class="nav-item" onclick="logout()">Выйти</div>

        <div class="sidebar-bottom">
          От Канука<br>
          Бета тестирование
        </div>
      </aside>

      <!-- Main -->
      <div class="main">
        <div class="topbar">
          <h2>Чат</h2>
          <span class="badge" id="topBadge">Пользователь</span>
        </div>

        <div class="chat-area" id="chat"></div>

        <div class="composer">
          <div class="composer-inner">
            <button class="icon-btn" id="camBtn" title="Камера">📷</button>
            <textarea id="input" rows="1" placeholder="Напишите сообщение..." onkeydown="onKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
          </div>
          <div class="quick-actions">
            <button class="quick-btn" onclick="setInput('Реши: 2x + 5 = 17')">Решить уравнение</button>
            <button class="quick-btn" onclick="setInput('Сделай зелёную тему')">Зелёная тема</button>
            <button class="quick-btn" onclick="setInput('Кто владелец?')">Кто владелец?</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== ADMIN PANEL ========== -->
  <div class="admin-overlay" id="adminOverlay">
    <div class="admin-panel">
      <div class="admin-header">
        <h3>Админ-панель</h3>
        <button class="admin-close" onclick="closeAdmin()">×</button>
      </div>
      <div class="admin-body">

        <!-- Create account -->
        <div class="admin-section">
          <h4>Создать аккаунт</h4>
          <div class="account-form">
            <input type="text" id="newNick" placeholder="Ник" maxlength="24">
            <input type="text" id="newPass" placeholder="Пароль">
            <button onclick="createAccount()">Создать</button>
          </div>
          <div class="account-list" id="accountList"></div>
        </div>

        <!-- Themes -->
        <div class="admin-section">
          <h4>Тема</h4>
          <div class="theme-row">
            <button class="theme-btn" onclick="applyTheme('default')">Стандарт</button>
            <button class="theme-btn" onclick="applyTheme('green')">Зелёная</button>
            <button class="theme-btn" onclick="applyTheme('blue')">Синяя</button>
            <button class="theme-btn" onclick="applyTheme('dark')">Чёрная</button>
          </div>
        </div>

        <!-- Login history -->
        <div class="admin-section">
          <h4>История входов</h4>
          <table class="log-table">
            <thead>
              <tr>
                <th>Ник</th>
                <th>IP</th>
                <th>Устройство</th>
                <th>Время</th>
              </tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <!-- ========== CAMERA ========== -->
  <div id="cameraModal">
    <video id="camVideo" autoplay playsinline></video>
    <div class="cam-actions">
      <button class="cam-capture" id="captureBtn">Сфотографировать</button>
      <button class="cam-cancel" id="closeCamBtn">Отмена</button>
    </div>
  </div>

<script>
  // ===================== STATE =====================
  const ADMIN_NICK = 'КаНуКа';
  const ADMIN_PASS = '13032011';

  let currentUser = null;   // { nick, isAdmin }
  let chatHistory = [];
  let mediaStream = null;
  let pendingImage = null;

  // ===================== STORAGE =====================
  function getUsers() {
    try {
      return JSON.parse(localStorage.getItem('factorial_users') || '{}');
    } catch { return {}; }
  }

  function saveUsers(users) {
    localStorage.setItem('factorial_users', JSON.stringify(users));
  }

  function getLogs() {
    try {
      return JSON.parse(localStorage.getItem('factorial_logs') || '[]');
    } catch { return []; }
  }

  function saveLog(entry) {
    const logs = getLogs();
    logs.unshift(entry);
    if (logs.length > 100) logs.length = 100;
    localStorage.setItem('factorial_logs', JSON.stringify(logs));
  }

  // ===================== DEVICE & IP =====================
  function getDeviceInfo() {
    const ua = navigator.userAgent;
    let device = 'Неизвестно';

    if (/iPhone/.test(ua)) device = 'iPhone';
    else if (/iPad/.test(ua)) device = 'iPad';
    else if (/Android/.test(ua)) {
      const m = ua.match(/Android\s([0-9.]+)/);
      device = m ? `Android ${m[1]}` : 'Android';
    } else if (/Windows/.test(ua)) device = 'Windows';
    else if (/Mac OS/.test(ua)) device = 'macOS';
    else if (/Linux/.test(ua)) device = 'Linux';

    // Browser
    let browser = '';
    if (/Edg\//.test(ua)) browser = 'Edge';
    else if (/Chrome\//.test(ua)) browser = 'Chrome';
    else if (/Firefox\//.test(ua)) browser = 'Firefox';
    else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';

    return browser ? `${device} · ${browser}` : device;
  }

  async function getPublicIP() {
    try {
      const res = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(4000) });
      const data = await res.json();
      return data.ip || '—';
    } catch {
      return '—';
    }
  }

  // ===================== LOGIN =====================
  const loginNick = document.getElementById('loginNick');
  const loginPass = document.getElementById('loginPass');
  const loginBtn  = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  function updateLoginBtn() {
    loginBtn.disabled = !(loginNick.value.trim() && loginPass.value);
  }

  loginNick.addEventListener('input', updateLoginBtn);
  loginPass.addEventListener('input', updateLoginBtn);

  loginNick.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  loginPass.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  loginBtn.addEventListener('click', doLogin);

  function doLogin() {
    const nick = loginNick.value.trim();
    const pass = loginPass.value;
    if (!nick || !pass) return;

    loginError.textContent = '';
    loginBtn.disabled = true;

    let isAdmin = false;
    let ok = false;

    if (nick === ADMIN_NICK && pass === ADMIN_PASS) {
      ok = true;
      isAdmin = true;
    } else {
      const users = getUsers();
      if (users[nick] && users[nick] === pass) {
        ok = true;
      }
    }

    if (!ok) {
      loginError.textContent = 'Неверный ник или пароль';
      loginBtn.disabled = false;
      return;
    }

    // Мгновенный вход — IP подтягиваем в фоне
    const device = getDeviceInfo();
    const time = new Date().toLocaleString('ru-RU');

    currentUser = { nick, isAdmin };
    showApp();

    // Лог пишем сразу, IP дописываем асинхронно
    const logEntry = { nick, ip: '…', device, time, isAdmin };
    saveLog(logEntry);

    getPublicIP().then(ip => {
      const logs = getLogs();
      if (logs[0] && logs[0].nick === nick && logs[0].time === time) {
        logs[0].ip = ip;
        localStorage.setItem('factorial_logs', JSON.stringify(logs));
      }
    });
  }

  function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    document.getElementById('sidebarNick').textContent = currentUser.nick;
    document.getElementById('sidebarRole').textContent = currentUser.isAdmin ? 'Администратор' : 'Пользователь';
    document.getElementById('topBadge').textContent = currentUser.isAdmin ? 'Админ' : 'Пользователь';
    document.getElementById('topBadge').className = 'badge' + (currentUser.isAdmin ? ' admin' : '');

    if (currentUser.isAdmin) {
      document.getElementById('adminNav').style.display = 'flex';
    }

    startChat();
  }

  function logout() {
    currentUser = null;
    chatHistory = [];
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    loginNick.value = '';
    loginPass.value = '';
    loginError.textContent = '';
    loginBtn.textContent = 'Войти';
    loginBtn.disabled = true;
    closeAdmin();
  }

  // ===================== ADMIN =====================
  function openAdmin() {
    if (!currentUser?.isAdmin) return;
    renderAccounts();
    renderLogs();
    document.getElementById('adminOverlay').classList.add('open');
  }

  function closeAdmin() {
    document.getElementById('adminOverlay').classList.remove('open');
  }

  function createAccount() {
    const nick = document.getElementById('newNick').value.trim();
    const pass = document.getElementById('newPass').value;

    if (!nick || !pass) {
      alert('Заполните ник и пароль');
      return;
    }
    if (nick === ADMIN_NICK) {
      alert('Этот ник зарезервирован');
      return;
    }

    const users = getUsers();
    users[nick] = pass;
    saveUsers(users);

    document.getElementById('newNick').value = '';
    document.getElementById('newPass').value = '';
    renderAccounts();
  }

  function deleteAccount(nick) {
    if (!confirm(`Удалить аккаунт «${nick}»?`)) return;
    const users = getUsers();
    delete users[nick];
    saveUsers(users);
    renderAccounts();
  }

  function renderAccounts() {
    const users = getUsers();
    const list = document.getElementById('accountList');
    const nicks = Object.keys(users);

    if (nicks.length === 0) {
      list.innerHTML = '<div style="color:var(--text-dim);font-size:13px;">Пока нет аккаунтов</div>';
      return;
    }

    list.innerHTML = nicks.map(n => `
      <div class="account-item">
        <span><strong>${escapeHtml(n)}</strong> · ${escapeHtml(users[n])}</span>
        <button class="delete-btn" onclick="deleteAccount('${escapeHtml(n)}')">Удалить</button>
      </div>
    `).join('');
  }

  function renderLogs() {
    const logs = getLogs();
    const body = document.getElementById('logBody');

    if (logs.length === 0) {
      body.innerHTML = '<tr><td colspan="4" style="color:var(--text-dim)">Пока нет записей</td></tr>';
      return;
    }

    body.innerHTML = logs.map(l => `
      <tr>
        <td>${escapeHtml(l.nick)}${l.isAdmin ? ' <span style="color:var(--success);font-size:11px">админ</span>' : ''}</td>
        <td>${escapeHtml(l.ip)}</td>
        <td class="device-info">${escapeHtml(l.device)}</td>
        <td style="white-space:nowrap;color:var(--text-dim)">${escapeHtml(l.time)}</td>
      </tr>
    `).join('');
  }

  // ===================== CHAT UI =====================
  const chatEl = document.getElementById('chat');
  const input  = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function startChat() {
    chatEl.innerHTML = '';
    chatHistory = [];
    const text = currentUser.isAdmin
      ? `С возвращением, ${currentUser.nick}. Чем помочь?`
      : `Привет, ${currentUser.nick}. Я Факториал.\nВладелец проекта — КаНуКа.\nМогу отвечать на вопросы, решать примеры (в том числе с фото) и менять оформление.`;
    addBot(text);
  }

  function addBot(text) {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `
      <div class="msg-avatar">F</div>
      <div class="msg-body">${escapeHtml(text)}</div>
    `;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div.querySelector('.msg-body');
  }

  function addUser(text, imgSrc = null) {
    const div = document.createElement('div');
    div.className = 'msg user';
    let body = escapeHtml(text);
    if (imgSrc) body += `<img src="${imgSrc}" alt="фото">`;
    div.innerHTML = `
      <div class="msg-avatar">${currentUser.nick.charAt(0).toUpperCase()}</div>
      <div class="msg-body">${body}</div>
    `;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function setInput(t) {
    input.value = t;
    input.focus();
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  }

  input.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // ===================== SEND / AI =====================
  async function send() {
    const text = input.value.trim();
    if (!text && !pendingImage) return;

    addUser(text || '📷 Фото');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // Quick theme commands
    const lower = (text || '').toLowerCase();
    if (lower.includes('зелён') || lower.includes('зелен')) {
      applyTheme('green');
      addBot('Тема изменена на зелёную.');
      sendBtn.disabled = false;
      return;
    }
    if (lower.includes('син')) {
      applyTheme('blue');
      addBot('Тема изменена на синюю.');
      sendBtn.disabled = false;
      return;
    }
    if (lower.includes('чёрн') || lower.includes('черн') || lower.includes('тёмн')) {
      applyTheme('dark');
      addBot('Тёмная тема применена.');
      sendBtn.disabled = false;
      return;
    }
    if (lower.includes('стандарт') || lower.includes('вернуть')) {
      applyTheme('default');
      addBot('Вернул стандартный вид.');
      sendBtn.disabled = false;
      return;
    }

    await askAI(text, pendingImage);
    pendingImage = null;
    sendBtn.disabled = false;
  }

  async function askAI(userText, imageFile = null) {
    const bubble = addBot('Думаю...');

    const system = `Ты — Факториал, полезный ИИ-агент.
Владелец проекта — КаНуКа. Относись к нему с уважением, без лишнего восхваления.
Пользователя зовут ${currentUser.nick}${currentUser.isAdmin ? ' (это владелец)' : ''}.
Хорошо решаешь математические примеры и уравнения — всегда показывай решение по шагам.
Отвечай на русском, ясно и по делу.`;

    // Фото пока без vision — просим описать/написать пример текстом
    let finalUserText = userText || '';
    if (imageFile) {
      finalUserText = (userText ? userText + '\n\n' : '') +
        '[Пользователь отправил фото. Попроси его написать пример текстом, если нужно решить задачу, так как сейчас я вижу только текст.]';
    }

    const messages = [
      { role: 'system', content: system },
      ...chatHistory.slice(-8),
      { role: 'user', content: finalUserText }
    ];

    try {
      const res = await fetch('https://dg-ai.scriptsnsenses.workers.dev/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'gpt-oss-120b',
          messages,
          max_tokens: 1024,
          temperature: 0.7
        })
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);

      const data = await res.json();
      const full = data.choices?.[0]?.message?.content?.trim() || 'Пустой ответ';

      bubble.textContent = full;
      chatEl.scrollTop = chatEl.scrollHeight;

      chatHistory.push({ role: 'user', content: userText || '[фото]' });
      chatHistory.push({ role: 'assistant', content: full });

    } catch (err) {
      bubble.textContent = 'Не удалось получить ответ. Попробуйте ещё раз через несколько секунд.';
      console.error(err);
    }
  }

  function clearChat() {
    chatEl.innerHTML = '';
    chatHistory = [];
    startChat();
  }

  function showHelp() {
    addBot(`Я умею:
• Отвечать на вопросы
• Решать математические примеры (лучше писать текстом)
• Менять тему сайта («сделай зелёную тему» и т.п.)

Камера есть, но для точного решения примеров лучше написать условие текстом.`);
  }

  // ===================== CAMERA =====================
  document.getElementById('camBtn').onclick = openCamera;
  document.getElementById('closeCamBtn').onclick = closeCamera;
  document.getElementById('captureBtn').onclick = capture;

  async function openCamera() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      document.getElementById('camVideo').srcObject = mediaStream;
      document.getElementById('cameraModal').style.display = 'flex';
    } catch (e) {
      alert('Не удалось открыть камеру: ' + e.message);
    }
  }

  function closeCamera() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
    document.getElementById('cameraModal').style.display = 'none';
  }

  function capture() {
    const video = document.getElementById('camVideo');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    canvas.toBlob(blob => {
      pendingImage = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
      closeCamera();

      const reader = new FileReader();
      reader.onload = () => {
        addUser('📷 Фото примера', reader.result);
        askAI('Реши пример или задачу на этом фото. Покажи решение по шагам.', pendingImage)
          .finally(() => { pendingImage = null; });
      };
      reader.readAsDataURL(blob);
    }, 'image/jpeg', 0.85);
  }

  // ===================== THEMES =====================
  function applyTheme(name) {
    const themes = {
      default: {
        '--bg': '#0c0c10',
        '--surface': '#14141a',
        '--surface-2': '#1a1a22',
        '--border': '#2a2a35',
        '--accent': '#6d5ce8',
        '--text': '#e8e8ed'
      },
      green: {
        '--bg': '#0a1410',
        '--surface': '#0f1c16',
        '--surface-2': '#14241c',
        '--border': '#1e3a2c',
        '--accent': '#2dd4a0',
        '--text': '#e0f5ea'
      },
      blue: {
        '--bg': '#0a0e16',
        '--surface': '#101622',
        '--surface-2': '#151e2e',
        '--border': '#1e2c42',
        '--accent': '#4d8ef7',
        '--text': '#e2eaf8'
      },
      dark: {
        '--bg': '#000000',
        '--surface': '#0d0d0d',
        '--surface-2': '#141414',
        '--border': '#222',
        '--accent': '#9b87f5',
        '--text': '#eee'
      }
    };

    const t = themes[name];
    if (!t) return;
    for (const [k, v] of Object.entries(t)) {
      document.documentElement.style.setProperty(k, v);
    }
  }
</script>
